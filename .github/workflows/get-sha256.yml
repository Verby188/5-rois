name: Get SHA256
on: workflow_dispatch
jobs:
  sha:
    runs-on: ubuntu-latest
    steps:
      - name: Get SHA256
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          keytool -list -v -keystore keystore.jks -alias u9game -storepass ${{ secrets.STORE_PASSWORD }} | grep SHA256
